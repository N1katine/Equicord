name: P2PScreenShare Release
# Publishes the build that install.bat installs; friends' Equicord updater checks this release.
on:
    push:
        branches:
            - feat/p2p-screenshare
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: p2p-release
    cancel-in-progress: true

jobs:
    Release:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build
              run: pnpm buildStandalone
              env:
                  EQUICORD_REMOTE: ${{ github.repository }}

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  sed 's/$/\r/' install.bat > dist/install.bat
                  gh release view latest > /dev/null 2>&1 || gh release create latest --title "P2PScreenShare" --notes "Baixe o install.bat abaixo e execute. As atualizações chegam pelo próprio Equicord."
                  gh release upload latest --clobber dist/desktop.asar dist/install.bat
                  # The updater takes the published commit from the title's last word, so it changes only after the upload.
                  gh release edit latest --title "P2PScreenShare $GITHUB_SHA"
